name: Security baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Audit NPM dependencies
        run: npm audit --audit-level=high

      - name: Boot Laravel and inspect routes
        run: |
          cp .env.example .env
          php artisan key:generate --force
          routes="$(php artisan route:list --json)"

          if printf '%s' "$routes" | grep -q '"uri":"up"'; then
            echo 'Security regression: the default Laravel health route /up is exposed.' >&2
            exit 1
          fi

          if ! printf '%s' "$routes" | grep -q 'index.php'; then
            echo 'Security regression: the canonical redirect /index.php is missing.' >&2
            exit 1
          fi

      - name: Check public directory for sensitive files
        run: |
          for file in .env .env.backup composer.json package.json vite.config.js; do
            if [ -e "public/$file" ]; then
              echo "Security regression: public/$file must not be published." >&2
              exit 1
            fi
          done

      - name: Check production configuration defaults
        run: |
          if grep -Eq '^APP_DEBUG=(true|1|yes)' .env.example; then
            echo 'Security regression: APP_DEBUG must be disabled by default.' >&2
            exit 1
          fi
          if ! grep -Eq '^SESSION_ENCRYPT=true' .env.example; then
            echo 'Security regression: SESSION_ENCRYPT must stay enabled by default.' >&2
            exit 1
          fi

      - name: PHP syntax and whitespace checks
        run: |
          find app bootstrap config routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
