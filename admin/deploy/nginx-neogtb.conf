# /etc/nginx/sites-enabled/neogtb
# NeoGTB — Laravel + Filament (apex/www + admin)
# Hardening sécurité : HSTS, CSP, COOP/CORP, security.txt, blocs 404 propres
# Audit : 2026-05-04

# ============================================================
# www.neogtb.fr / neogtb.fr
# ============================================================
server {
    server_name neogtb.fr www.neogtb.fr;

    root /var/www/neogtb/current/admin/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 20M;

    # --- security.txt ---
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: mailto:hello@neogtb.fr\nExpires: 2027-05-04T00:00:00.000Z\nPreferred-Languages: fr, en\nCanonical: https://neogtb.fr/.well-known/security.txt\n";
    }

    # --- Headers sécurité ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    # CSP front : émise par LARAVEL (App\Http\Middleware\FrontCspHeader), pas ici.
    # MIGRATION CSP (audit 2026-06-09, finding HAUTE) — état :
    #   [FAIT] Front migré vers le build CSP d'Alpine (@alpinejs/csp) : plus de new Function().
    #   [FAIT] 'unsafe-eval' retiré du script-src.
    #   [FAIT] 'unsafe-inline' retiré du script-src : remplacé par un nonce par requête (phase 2).
    #          Le nonce ne pouvant être généré qu'à la requête (PHP), la CSP front est désormais
    #          posée par le middleware Laravel. NE PAS la ré-émettre ici : un second header CSP
    #          créerait une politique intersectée (les deux s'appliquent) et casserait le nonce.
    #          style-src garde 'unsafe-inline' (styles inline Tailwind/Alpine) — phase 3 éventuelle.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection: 0 — désactive le filtre XSS legacy des navigateurs (buggé, source de faux positifs).
    # La protection XSS repose sur la CSP. Header conservé car encore scanné par les outils d'audit.
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), interest-cohort=()" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    location ~* \.(webp|jpg|jpeg|png|gif|ico|css|js|woff2?|svg|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Back-office Filament : non exposé sur le domaine public — rediriger vers le sous-domaine dédié.
    # (Ferme l'exposition de /admin/login sur neogtb.fr ; le login reste joignable via admin.neogtb.fr.)
    location ^~ /admin {
        return 301 https://admin.neogtb.fr$request_uri;
    }

    # Assets dynamiques Livewire (route hashée) : laisser passer vers PHP plutôt que la règle statique `.js$`.
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # Blocs de protection : return 444 (ferme la connexion sans réponse) au lieu de 404,
    # pour ne PAS déclencher `error_page 404 /index.php` → évite de faire tourner PHP/Laravel
    # à chaque scan d'attaquant (.env, .git, /storage, manifest Vite…).
    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~* \.(env|log|sql|sqlite|md|lock|yaml|yml|ini|conf|bak|old|tmp)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ ^/(storage|bootstrap|database|app|config|resources|routes|tests|vendor|node_modules)/ {
        return 444;
    }

    # Ne pas exposer le manifest Vite (révèle la structure du build)
    location ~ ^/build/.*\.json$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl;                  # managed by Certbot
    http2 on;                        # multiplexage + compression des en-têtes (nginx ≥ 1.25.1)
    ssl_certificate /etc/letsencrypt/live/neogtb.fr-0001/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/neogtb.fr-0001/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                         # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                           # managed by Certbot
}

server {
    if ($host = www.neogtb.fr) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = neogtb.fr)     { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name neogtb.fr www.neogtb.fr;
    return 404; # managed by Certbot
}

# ============================================================
# admin.neogtb.fr — back-office Filament
# ============================================================
server {
    server_name admin.neogtb.fr;

    # Audit BACS (projet séparé) : lien privé non référencé servi via ce snippet.
    # Présent sur le live — à conserver dans la conf versionnée pour ne pas le perdre au déploiement.
    include snippets/audit-bacs.conf;

    root /var/www/neogtb/current/admin/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP admin Filament. Police Inter servie par Bunny Fonts (fonts.bunny.net), alternative RGPD-compliant
    # à Google Fonts (hébergement EU, sans logs ni cookies) — chargée par Filament via ->font('Inter').
    # 'unsafe-eval' requis par Alpine.js (embarqué par Filament/Livewire). img-src blob: pour les aperçus d'upload.
    # object-src 'none' : durcissement sûr (bloque <object>/<embed>/plugins, aucun impact sur Filament/Alpine).
    # script-src garde 'unsafe-inline'/'unsafe-eval' : OBLIGATOIRE pour Filament v5 + Alpine (bundle Livewire
    # standard avec new Function, scripts inline non-nonçables). Le durcir casserait l'admin (cf. discussion Filament #7032).
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https://neogtb.fr https://www.neogtb.fr; connect-src 'self' https://plausible.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # NB : pas de Cross-Origin-Embedder-Policy: require-corp ici — incompatible avec la police
    # Inter chargée par Filament depuis Bunny Fonts (cross-origin sans header CORP). L'isolation
    # cross-origin (SharedArrayBuffer, timers haute résolution) n'apporte aucun bénéfice à ce panel.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection: 0 — désactive le filtre XSS legacy des navigateurs (buggé, source de faux positifs).
    # La protection XSS repose sur la CSP. Header conservé car encore scanné par les outils d'audit.
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), interest-cohort=()" always;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(webp|jpg|jpeg|png|gif|ico|css|js|woff2?|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets dynamiques Livewire (route hashée /livewire-<hash>/{livewire.min.js,css/*,js/*}) :
    # laisser passer vers PHP. Sans ce bloc, la regex statique `.js$`/`.css$` ci-dessus les
    # avale en 404 (ce ne sont pas des fichiers sur disque) et casse le runtime Filament/Livewire.
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        return 404;
    }

    listen 443 ssl;
    http2 on;                        # multiplexage + compression des en-têtes (nginx ≥ 1.25.1)
    ssl_certificate /etc/letsencrypt/live/admin.neogtb.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.neogtb.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = admin.neogtb.fr) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name admin.neogtb.fr;
    return 404;
}
