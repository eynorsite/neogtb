# =============================================================================
# NeoGTB — vhost nginx (Laravel + Filament)
# =============================================================================
# ⚠️  CE FICHIER EST LE MIROIR EXACT DE /etc/nginx/sites-enabled/neogtb
#
# Historique : la version précédente de ce fichier datait du 2026-04-07 et avait
# divergé de la production sur des points qui l'auraient CASSÉE si on l'avait
# déployée telle quelle (root /var/www/neogtb-laravel-new au lieu de
# /var/www/neogtb/current, socket php8.4 au lieu de php8.5, CSP admin absente,
# HSTS sans preload, snippet audit-bacs perdu). Elle a été remplacée par un
# export de la production du 2026-08-15, auquel sont appliqués les correctifs
# de l'audit de sécurité du même jour (cf. docs/AUDIT_SECURITE_2026-08-15.html).
#
# RÈGLE : toute modification faite en prod doit être reportée ici dans la foulée.
# Un fichier de configuration versionné faux est plus dangereux qu'absent.
#
# Déploiement :
#   sudo cp admin/deploy/nginx-neogtb-laravel.conf /etc/nginx/sites-enabled/neogtb
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ============================================================
# neogtb.fr — site public
# ============================================================
server {
    server_name neogtb.fr;

    root /var/www/neogtb/current/admin/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 20M;

    # --- security.txt ---
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: mailto:hello@neogtb.fr\nExpires: 2027-05-04T00:00:00.000Z\nPreferred-Languages: fr, en\nCanonical: https://neogtb.fr/.well-known/security.txt\n";
    }

    # --- Headers sécurité ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    # CSP front : émise par LARAVEL (App\Http\Middleware\FrontCspHeader), pas ici.
    # MIGRATION CSP (audit 2026-06-09, finding HAUTE) — état :
    #   [FAIT] Front migré vers le build CSP d'Alpine (@alpinejs/csp) : plus de new Function().
    #   [FAIT] 'unsafe-eval' retiré du script-src.
    #   [FAIT] 'unsafe-inline' retiré du script-src : remplacé par un nonce par requête (phase 2).
    #          Le nonce ne pouvant être généré qu'à la requête (PHP), la CSP front est désormais
    #          posée par le middleware Laravel. NE PAS la ré-émettre ici : un second header CSP
    #          créerait une politique intersectée (les deux s'appliquent) et casserait le nonce.
    #          style-src garde 'unsafe-inline' (styles inline Tailwind/Alpine) — phase 3 éventuelle.
    #   [FAIT 2026-08-15] object-src 'none' + upgrade-insecure-requests ajoutés côté middleware.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection: 0 — désactive le filtre XSS legacy des navigateurs (buggé, source de faux positifs).
    # La protection XSS repose sur la CSP. Header conservé car encore scanné par les outils d'audit.
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), interest-cohort=()" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    location ~* \.(webp|jpg|jpeg|png|gif|ico|css|js|woff2?|svg|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;

        # AUDIT 2026-08-15 — dès qu'un `add_header` figure dans un location, nginx ignore
        # TOUS ceux du bloc server parent. Les assets statiques (CSS/JS compris) partaient
        # donc SANS aucun header de sécurité : mesuré, aucun nosniff sur /build/assets/*.css.
        # Ils doivent être ré-émis ici à l'identique.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # Back-office Filament : non exposé sur le domaine public — rediriger vers le sous-domaine dédié.
    # (Ferme l'exposition de /admin/login sur neogtb.fr ; le login reste joignable via admin.neogtb.fr.)
    #
    # AUDIT 2026-08-15 — le préfixe était `^~ /admin` (sans slash) : il attrapait donc TOUT
    # chemin commençant par « admin », dont /adminer.php, qui repartait en 301 vers
    # admin.neogtb.fr et révélait gratuitement l'adresse du back-office à n'importe quel
    # scan de chemins usuels. Découpé en préfixe exact + préfixe avec slash.
    location = /admin { return 301 https://admin.neogtb.fr$request_uri; }
    location ^~ /admin/ { return 301 https://admin.neogtb.fr$request_uri; }

    # Assets dynamiques Livewire (route hashée) : laisser passer vers PHP plutôt que la règle statique `.js$`.
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # Blocs de protection : return 444 (ferme la connexion sans réponse) au lieu de 404,
    # pour ne PAS déclencher `error_page 404 /index.php` → évite de faire tourner PHP/Laravel
    # à chaque scan d'attaquant (.env, .git, /storage, manifest Vite…).
    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~* \.(env|log|sql|sqlite|md|lock|yaml|yml|ini|conf|bak|old|tmp)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~ ^/(storage|bootstrap|database|app|config|resources|routes|tests|vendor|node_modules)/ {
        return 444;
    }

    # Ne pas exposer le manifest Vite (révèle la structure du build)
    location ~ ^/build/.*\.json$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl;                  # managed by Certbot
    http2 on;                        # multiplexage + compression des en-têtes (nginx ≥ 1.25.1)
    ssl_certificate /etc/letsencrypt/live/neogtb.fr-0001/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/neogtb.fr-0001/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                         # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                           # managed by Certbot
}

# ============================================================
# www.neogtb.fr → neogtb.fr
# ============================================================
# AUDIT 2026-08-15 — www était servi par le MÊME bloc que l'apex (server_name
# « neogtb.fr www.neogtb.fr »). Résultat mesuré : https://www.neogtb.fr répondait 200
# et servait le site complet avec un canonical auto-référent vers www — soit une copie
# indexable intégrale du site. Le sous-domaine est désormais un simple redirecteur 301.
server {
    server_name www.neogtb.fr;

    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/neogtb.fr-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neogtb.fr-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://neogtb.fr$request_uri;
}

server {
    if ($host = www.neogtb.fr) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = neogtb.fr)     { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name neogtb.fr www.neogtb.fr;
    return 404; # managed by Certbot
}

# ============================================================
# neogtb.com → neogtb.fr
# ============================================================
# AUDIT SEO 2026-08-15 — neogtb.com et www.neogtb.com résolvent bien vers ce VPS
# (51.210.11.125) mais AUCUN bloc server ne les déclarait : les deux hôtes ne
# répondaient ni en HTTP ni en HTTPS (connexion échouée, code curl 000). Tout le
# trafic tapé en .com — saisie directe, liens de partenaires, signatures d'e-mail —
# était perdu, et le domaine de marque restait inexploité.
#
# Le .com devient un pur redirecteur 301 vers le .fr canonique : aucun contenu n'y est
# servi, donc aucun risque de duplication d'index.
#
# PRÉREQUIS avant activation du bloc 443 : émettre le certificat, sinon nginx
# refusera de démarrer.
#   sudo certbot --nginx -d neogtb.com -d www.neogtb.com
# Certbot renseigne alors lui-même ssl_certificate / ssl_certificate_key ci-dessous.
server {
    listen 80;
    listen [::]:80;
    server_name neogtb.com www.neogtb.com;

    # Laisse passer le challenge HTTP-01 du renouvellement Certbot.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://neogtb.fr$request_uri; }
}

