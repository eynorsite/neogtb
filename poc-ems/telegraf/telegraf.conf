#    avec une charge connue (une bouilloire ~2000 W doit afficher ~2000 W) avant
#    toute démo. Un mauvais mapping affiche des valeurs plausibles mais fausses.
# Un FLOAT32 occupe 2 registres consécutifs -> address = [n, n+1].
