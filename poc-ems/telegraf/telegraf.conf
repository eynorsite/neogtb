# Telegraf — POC EMS NeoGTB
# Acquisition des mesures -> InfluxDB 2.7
# Par défaut : DONNÉES SIMULÉES (inputs.mock). Bloc Modbus réel plus bas (désactivé).

[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

###############################################################################
# SORTIE — InfluxDB 2.7
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

###############################################################################
# ENTRÉE A1 — DONNÉES SIMULÉES (activée par défaut, zéro matériel)
# Simule un compteur d'énergie général : puissance, tension, courant, cos φ, index kWh.
# measurement = "energie" (réutilisé par le dashboard Grafana fourni).
###############################################################################
[[inputs.mock]]
  metric_name = "energie"
  [inputs.mock.tags]
    site = "demo"
    equipement = "compteur-general"

  [[inputs.mock.random]]
    name = "puissance_w"
    min = 600.0
    max = 2800.0

  [[inputs.mock.random]]
    name = "tension_v"
    min = 228.0
    max = 235.0

  [[inputs.mock.random]]
    name = "courant_a"
    min = 2.5
    max = 12.0

  [[inputs.mock.random]]
    name = "cos_phi"
    min = 0.85
    max = 0.99

  # Index d'énergie cumulé qui s'incrémente (simule un compteur kWh)
  [[inputs.mock.step]]
    name = "energie_kwh"
    start = 12000.0
    step = 0.05

###############################################################################
# ENTRÉE A2 / B — COMPTEUR MODBUS RÉEL (DÉSACTIVÉ — décommenter pour activer)
