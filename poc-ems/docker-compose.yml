# POC EMS NeoGTB — démonstration "consommations en temps réel"
# Stack 100 % open-source : Telegraf (acquisition) -> InfluxDB 2.7 (stockage) -> Grafana (dashboards)
#
# Par défaut : DONNÉES SIMULÉES (Telegraf inputs.mock), zéro matériel, zéro câblage.
# Pour brancher un vrai compteur Modbus : voir README.md (section « Brancher un compteur réel »).
#
# Démarrage :  cp .env.example .env  &&  docker compose up -d
# Dashboard  :  http://localhost:3000   (admin / voir .env)

name: poc-ems-neogtb

services:
  influxdb:
    image: influxdb:2.7
    container_name: poc-ems-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-neogtb-poc-2026}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-neogtb}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-ems}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-neogtb-ems-poc-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  telegraf:
    image: telegraf:1.30
    container_name: poc-ems-telegraf
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:-neogtb-ems-poc-token-change-me}
      INFLUX_ORG: ${INFLUX_ORG:-neogtb}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-ems}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: poc-ems-grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-neogtb-poc-2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Variables réutilisées dans le provisioning du datasource InfluxDB
      INFLUX_TOKEN: ${INFLUX_TOKEN:-neogtb-ems-poc-token-change-me}
      INFLUX_ORG: ${INFLUX_ORG:-neogtb}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-ems}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
