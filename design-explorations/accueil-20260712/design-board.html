<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoGTB — Exploration accueil · 3 directions</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: var(--dark-100); color: var(--text-title); }
  .board-head {
    position: sticky; top: 0; z-index: 20; background: var(--primary-500); color: #fff;
    padding: 16px 28px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    border-bottom: 3px solid var(--accent-600);
  }
  .board-head h1 { color: #fff; font-size: 20px; letter-spacing: -0.01em; }
  .board-head .sub { color: var(--primary-100); font-size: 13px; margin-top: 2px; }
  .board-head .brand { font-weight: 800; }
  .board-head .brand em { font-style: normal; color: var(--accent-400); }
  .spacer { flex: 1; }
  .toggle { display: inline-flex; background: var(--primary-700); border-radius: var(--radius-pill); padding: 4px; gap: 4px; }
  .toggle button {
    font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--primary-100);
    background: transparent; border: 0; padding: 7px 16px; border-radius: var(--radius-pill); cursor: pointer;
  }
  .toggle button.active { background: #fff; color: var(--primary-700); }
  .hint { font-size: 12px; color: var(--primary-100); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 24px 28px 60px; align-items: start; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; } }

  .col { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-glass); overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .col-head { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .col-title { display: flex; align-items: center; gap: 10px; }
  .col-letter { width: 30px; height: 30px; border-radius: 8px; background: var(--primary-500); color: #fff; font-family: var(--font-display); font-weight: 800; display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
  .col-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--text-title); }
  .col-pitch { font-size: 13px; color: var(--text-body); margin-top: 8px; line-height: 1.5; }
  .col-actions { margin-top: 12px; display: flex; gap: 8px; }
  .col-actions a { font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--primary-600); }
  .col-actions a.primary { background: var(--accent-600); color: #fff; border-color: var(--accent-600); }

  .viewport { background: var(--dark-50); overflow: hidden; display: flex; justify-content: center; }
  .device { position: relative; overflow: hidden; }
  .device iframe { border: 0; background: #fff; transform-origin: top left; }
</style>
</head>
<body>
  <header class="board-head">
    <div>
      <h1><span class="brand">Neo<em>GTB</em></span> — Exploration de la page d'accueil</h1>
      <div class="sub">3 directions visuelles · même design system (navy + vert, Inter/DM Sans) · wireframes HTML</div>
    </div>
    <div class="spacer"></div>
    <div class="toggle" role="group" aria-label="Format d'aperçu">
      <button id="btn-desktop" class="active" onclick="setMode('desktop')">🖥️ Desktop</button>
      <button id="btn-mobile" onclick="setMode('mobile')">📱 Mobile</button>
    </div>
    <div class="hint">Astuce : « Ouvrir en plein écran » pour tester le responsive et le simulateur (direction C).</div>
  </header>

  <main class="grid" id="grid">
    <!-- colonnes injectées -->
  </main>

<script>
  const VARIANTS = [
    { key: 'a', letter: 'A', name: 'Institutionnel / Autorité',
      pitch: "Navy dominant, data réglementaire et sources officielles en avant. Signal : acteur établi, référence neutre." },
    { key: 'b', letter: 'B', name: 'Pédagogique / Clair',
      pitch: "Blanc lumineux, méthode en étapes, vert d'accompagnement, orbs très doux. Signal : on vous explique, on vous accompagne." },
    { key: 'c', letter: 'C', name: 'Outil / Preuve interactive',
      pitch: "Hero avec simulateur de conformité (kW → échéance) + grille d'outils gratuits. Signal : testez votre situation maintenant." },
  ];

  const MODES = {
    desktop: { w: 1280, h: 1600 },
    mobile:  { w: 390,  h: 1700 },
  };
  let mode = 'desktop';

  function colWidth() {
    // largeur utile d'une colonne (approx) : on lit la 1re .device après layout
    const d = document.querySelector('.device');
    return d ? d.clientWidth : 420;
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    VARIANTS.forEach(v => {
      const col = document.createElement('section');
      col.className = 'col';
      col.innerHTML = `
        <div class="col-head">
          <div class="col-title"><span class="col-letter">${v.letter}</span><span class="col-name">${v.name}</span></div>
          <p class="col-pitch">${v.pitch}</p>
          <div class="col-actions">
            <a class="primary" href="variant-${v.key}.html" target="_blank" rel="noopener">Ouvrir en plein écran ↗</a>
          </div>
        </div>
        <div class="viewport">
          <div class="device" data-key="${v.key}">
            <iframe src="variant-${v.key}.html" title="Variante ${v.letter}" loading="lazy"></iframe>
          </div>
        </div>`;
      grid.appendChild(col);
    });
    scaleAll();
  }

  function scaleAll() {
    const { w, h } = MODES[mode];
    document.querySelectorAll('.device').forEach(dev => {
      const avail = dev.parentElement.clientWidth; // largeur de .viewport
      const target = Math.min(avail, mode === 'mobile' ? w + 24 : avail);
      const scale = (mode === 'mobile' ? Math.min(1, (avail - 8) / w) : avail / w);
      const iframe = dev.querySelector('iframe');
      iframe.style.width = w + 'px';
      iframe.style.height = h + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
      dev.style.width = (w * scale) + 'px';
      dev.style.height = (h * scale) + 'px';
    });
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btn-desktop').classList.toggle('active', m === 'desktop');
    document.getElementById('btn-mobile').classList.toggle('active', m === 'mobile');
    scaleAll();
  }

  window.addEventListener('resize', scaleAll);
  render();
  // re-scale après chargement des iframes (fonts/layout)
  window.addEventListener('load', () => setTimeout(scaleAll, 200));
</script>
</body>
</html>
